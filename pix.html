<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagamento PIX - Tá Premiado</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222;padding:18px}
.card{max-width:520px;margin:35px auto;background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h1{text-align:center;margin:0 0 6px;font-size:30px}
.sub{text-align:center;color:#555;margin-bottom:24px}
.info{padding:12px 0;border-bottom:1px solid #e5e5e5;line-height:1.5}
.chave{background:#f3f3f3;border-radius:10px;padding:15px;margin-top:18px;text-align:center;word-break:break-all}
.chave strong{display:block;margin-top:8px;font-size:17px}
button{width:100%;padding:15px;margin-top:14px;border:0;border-radius:10px;background:#198754;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}
.msg{text-align:center;font-weight:bold;margin-top:12px;min-height:22px}
.aviso{font-size:13px;line-height:1.5;text-align:center;margin-top:22px;color:#555}
</style>
</head>
<body>
<div class="card">
  <h1>TÁ PREMIADO</h1>
  <div class="sub">Dados para pagamento via PIX</div>

  <div class="info"><strong>Titular:</strong> Felipe Fraile Labarce</div>
  <div class="info"><strong>Banco:</strong> Nubank</div>

  <div class="chave">
    Chave PIX
    <strong id="chave">36cbf041-f273-420c-bb4f-c57cc6b4cd02</strong>
  </div>

  <button id="copiar">COPIAR CHAVE PIX</button>
  <div id="msg" class="msg"></div>

  <div class="aviso">
    Antes de realizar o pagamento, confirme se sua reserva continua ativa.
    Após o pagamento, envie o comprovante pelo WhatsApp para conferência.
  </div>
</div>

<script>
document.getElementById("copiar").onclick=async()=>{
  const chave=document.getElementById("chave").textContent.trim();
  const msg=document.getElementById("msg");
  try{
    await navigator.clipboard.writeText(chave);
    msg.textContent="Chave PIX copiada!";
  }catch(e){
    const area=document.createElement("textarea");
    area.value=chave;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    msg.textContent="Chave PIX copiada!";
  }
};
</script>
</body>
</html>
