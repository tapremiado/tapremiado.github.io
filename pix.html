<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagamento PIX - Tá Premiado</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222;padding:18px}
.card{max-width:540px;margin:30px auto;background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h1{text-align:center;margin:0 0 5px;font-size:30px}.sub{text-align:center;color:#555;margin-bottom:20px}
.valor{font-size:28px;font-weight:bold;text-align:center;margin:18px 0;color:#198754}
.info{padding:10px 0;border-bottom:1px solid #e5e5e5;line-height:1.5}
.qr{text-align:center;margin:20px 0}.qr img{width:220px;height:220px;max-width:100%}
.codigo{background:#f3f3f3;border-radius:10px;padding:12px;font-size:11px;word-break:break-all;line-height:1.4}
button{width:100%;padding:15px;margin-top:14px;border:0;border-radius:10px;background:#198754;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}
.sec{background:#333}.msg{text-align:center;font-weight:bold;margin-top:12px;min-height:22px}
.aviso{font-size:13px;line-height:1.5;text-align:center;margin-top:20px;color:#555}
.erro{color:#b42318;text-align:center;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>TÁ PREMIADO</h1>
<div class="sub">Pagamento via PIX</div>
<div id="conteudo" style="display:none">
  <div class="valor" id="valorTela"></div>
  <div class="info"><strong>Titular:</strong> Felipe Fraile Labarce</div>
  <div class="info"><strong>Banco:</strong> Nubank</div>
  <div class="qr"><img id="qr" alt="QR Code PIX"></div>
  <div class="codigo" id="payload"></div>
  <button id="copiar">COPIAR PIX COPIA E COLA</button>
  <button class="sec" id="copiarChave">COPIAR SOMENTE A CHAVE PIX</button>
  <div id="msg" class="msg"></div>
  <div class="aviso">Confira no aplicativo do seu banco o nome do recebedor e o valor antes de confirmar o pagamento.</div>
</div>
<div id="erro" class="erro"></div>
</div>

<script>
const CHAVE="36cbf041-f273-420c-bb4f-c57cc6b4cd02";
const NOME="FELIPE FRAILE LABARCE";
const CIDADE="JAU";

function campo(id,valor){
  return id+String(valor.length).padStart(2,"0")+valor;
}
function crc16(str){
  let crc=0xFFFF;
  for(let c=0;c<str.length;c++){
    crc ^= str.charCodeAt(c)<<8;
    for(let i=0;i<8;i++){
      crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);
      crc &= 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4,"0");
}
function gerarPix(valor){
  const gui=campo("00","br.gov.bcb.pix");
  const chave=campo("01",CHAVE);
  const mai=campo("26",gui+chave);
  const adicional=campo("62",campo("05","***"));
  let p=
    campo("00","01")+
    campo("01","11")+
    mai+
    campo("52","0000")+
    campo("53","986")+
    campo("54",valor.toFixed(2))+
    campo("58","BR")+
    campo("59",NOME)+
    campo("60",CIDADE)+
    adicional+
    "6304";
  return p+crc16(p);
}
async function copiar(txt){
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){
    const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);
    t.select();document.execCommand("copy");t.remove();
  }
}
const params=new URLSearchParams(location.search);
const raw=(params.get("valor")||"").replace(",",".");
const valor=Number(raw);
if(!Number.isFinite(valor) || valor<=0 || valor>99999.99){
  document.getElementById("erro").textContent="Valor de pagamento inválido ou não informado.";
}else{
  const payload=gerarPix(valor);
  document.getElementById("conteudo").style.display="block";
  document.getElementById("valorTela").textContent=valor.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  document.getElementById("payload").textContent=payload;
  document.getElementById("qr").src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="+encodeURIComponent(payload);
  document.getElementById("copiar").onclick=async()=>{
    await copiar(payload);
    document.getElementById("msg").textContent="PIX Copia e Cola copiado!";
  };
  document.getElementById("copiarChave").onclick=async()=>{
    await copiar(CHAVE);
    document.getElementById("msg").textContent="Chave PIX copiada!";
  };
}
</script>
</body>
</html>
