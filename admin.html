<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Administrativo - F-1000</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}
.wrap{max-width:1100px;margin:auto;padding:18px}
h1{text-align:center;margin:6px 0 18px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:14px}
.login{max-width:430px;margin:50px auto}
input,button{width:100%;padding:12px;border-radius:8px;border:1px solid #bbb;font-size:15px;margin-top:8px}
button{cursor:pointer;font-weight:bold}
.entrar{background:#111;color:#fff;border:0}
.topo{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.sair{width:auto;background:#eee}
.contadores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.contador{text-align:center;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px}
.contador strong{display:block;font-size:25px;margin-top:5px}
.reserva{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:12px}
.numeros{font-size:20px;font-weight:bold;margin:8px 0}
.dados{line-height:1.6}
.acoes{display:flex;gap:8px;margin-top:12px}
.acoes button{margin:0}
.confirmar{background:#198754;color:#fff;border:0}
.liberar{background:#dc3545;color:#fff;border:0}
.pix{background:#2563eb;color:#fff;border:0}
.compartilhar{background:#198754;color:#fff;border:0}
.msg{text-align:center;font-weight:bold;margin:12px 0}
.vazio{text-align:center;padding:25px;background:#fff;border-radius:12px}
@media(max-width:650px){.contadores{grid-template-columns:1fr}.acoes{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">

<div id="loginBox" class="card login">
<h1>Painel Administrativo</h1>
<input id="email" type="email" placeholder="E-mail">
<input id="senha" type="password" placeholder="Senha">
<button id="entrar" class="entrar">ENTRAR</button>
<div id="loginMsg" class="msg"></div>
</div>

<div id="painel" style="display:none">
<div class="topo">
<h1>Painel F-1000</h1>
<button id="sair" class="sair">Sair</button>
</div>

<div class="contadores">
<div class="contador">Disponíveis<strong id="cDisponiveis">0</strong></div>
<div class="contador">Reservados<strong id="cReservados">0</strong></div>
<div class="contador">Confirmados<strong id="cConfirmados">0</strong></div>
</div>

<div id="msg" class="msg"></div>
<div id="reservas"></div>

<div class="card" id="controleGrupo" style="margin-top:20px">
  <h2>Controle do Grupo <span id="grupoCodigo">001</span></h2>
  <p><strong>Prêmio:</strong> <span id="grupoPremio">Carregando...</span></p>
  <p><strong>Status:</strong> <span id="grupoStatus">Carregando...</span></p>

  <div id="grupoEmAndamento">
    <input id="numeroContemplado" type="text" maxlength="3" placeholder="Número contemplado (001 a 999)">
    <button id="btnFinalizarGrupo" style="background:#198754;color:#fff;border:0">
      FINALIZAR GRUPO
    </button>
  </div>

  <div id="grupoFinalizado" style="display:none">
    <p><strong>Número contemplado:</strong> <span id="grupoNumeroContemplado"></span></p>
    <p><strong>Data da apuração:</strong> <span id="grupoDataApuracao"></span></p>
    <button id="btnNovoPremio" style="background:#2563eb;color:#fff;border:0">
  NOVO PRÊMIO
</button>
  </div>
</div>
  <h2 style="margin-top:28px">Confirmados</h2>
<div id="confirmados"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
const {createClient}=supabase;
const db=createClient(
  "https://sjvzuoflqfyfbnyravmy.supabase.co",
  "sb_publishable_GgzTsAlQtOLRYiBKItXSCA_QBIEA8TW"
);

const loginBox=document.getElementById("loginBox");
const painel=document.getElementById("painel");
const loginMsg=document.getElementById("loginMsg");
const msg=document.getElementById("msg");
const reservasBox=document.getElementById("reservas");
const confirmadosBox=document.getElementById("confirmados");

function esc(v){
 return String(v??"")
   .replaceAll("&","&amp;").replaceAll("<","&lt;")
   .replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

function dataBR(v){
 if(!v)return "";
 return new Date(v).toLocaleString("pt-BR");
}

async function verificarAdmin(){
 const {data,error}=await db.rpc("eh_admin");
 return !error && data===true;
}

async function abrirPainel(){
 const admin=await verificarAdmin();
 if(!admin){
   await db.auth.signOut();
   loginMsg.textContent="Usuário sem permissão administrativa.";
   loginBox.style.display="block";
   painel.style.display="none";
   return;
 }
 loginBox.style.display="none";
 painel.style.display="block";
 await carregar();
 await carregarConfirmadosSeparado();
}

document.getElementById("entrar").onclick=async()=>{
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("senha").value;
 loginMsg.textContent="Entrando...";
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error){loginMsg.textContent="E-mail ou senha incorretos.";return}
 loginMsg.textContent="";
 await abrirPainel();
};

document.getElementById("sair").onclick=async()=>{
 await db.auth.signOut();
 painel.style.display="none";
 loginBox.style.display="block";
 document.getElementById("senha").value="";
};

async function carregar(){
 msg.textContent="Carregando...";
 const {data,error}=await db.rpc("admin_listar_reservas");
 if(error){msg.textContent="Não foi possível carregar o painel.";return}

 const todos=data||[];
 document.getElementById("cDisponiveis").textContent=todos.filter(x=>x.status==="disponivel").length;
 document.getElementById("cReservados").textContent=todos.filter(x=>x.status==="reservado").length;
 document.getElementById("cConfirmados").textContent=todos.filter(x=>x.status==="confirmado"||x.status==="pago").length;

 const reservados=todos.filter(x=>x.status==="reservado");
 const grupos=new Map();

 reservados.forEach(x=>{
   const chave=x.reserva_id
      ? "reserva:"+x.reserva_id
      : [x.nome,x.telefone,x.cpf,x.reservado_em].join("|");
   if(!grupos.has(chave)) grupos.set(chave,{...x,numeros:[]});
   grupos.get(chave).numeros.push(x.numero);
 });

 reservasBox.innerHTML="";
 msg.textContent="";

 if(grupos.size===0){
   reservasBox.innerHTML='<div class="vazio">Nenhuma reserva aguardando confirmação.</div>';
   return;
 }

 [...grupos.values()]
 .sort((a,b)=>new Date(b.reservado_em)-new Date(a.reservado_em))
 .forEach(r=>{
   r.numeros.sort();
   const div=document.createElement("div");
   div.className="reserva";
   div.innerHTML=`
     <div><strong>RESERVADO</strong></div>
     <div class="numeros">${r.numeros.map(esc).join(", ")}</div>
     <div class="dados">
       <strong>Nome:</strong> ${esc(r.nome)}<br>
       <strong>WhatsApp:</strong> ${esc(r.telefone || r.whatsapp || "")}<br>
       <strong>CPF:</strong> ${esc(r.cpf)}<br>
       <strong>Reservado em:</strong> ${esc(dataBR(r.reservado_em))}
     </div>
     <div class="acoes">
       <button class="confirmar">CONFIRMAR TODOS (${r.numeros.length})</button>
       <button class="liberar">LIBERAR TODOS (${r.numeros.length})</button>
       <button class="whatsapp">CHAMAR NO WHATSAPP</button>
        <button class="pix">ENVIAR DADOS PIX</button>
     </div>`;
   const [conf,lib,whats,pix]=div.querySelectorAll("button");
   conf.onclick=()=>alterar(r.numeros[0],"confirmar",r.numeros.length);
   lib.onclick=()=>alterar(r.numeros[0],"liberar",r.numeros.length);
   whats.onclick=()=>{
  const telefone=String(r.telefone||"").replace(/\D/g,"");
  const fone=telefone.startsWith("55")?telefone:"55"+telefone;
  const numeros=r.numeros.join(", ");
  const total=r.numeros.length*100;
  const mensagem=`Olá, ${r.nome}!

Sua reserva no Tá Premiado foi registrada com sucesso.

Número(s) reservado(s): ${numeros}
Valor total: R$ ${total.toFixed(2).replace(".",",")}

Para prosseguir com sua participação, responda CONFIRMO por este WhatsApp.

Após sua confirmação, enviaremos os dados para pagamento.

Tá Premiado
Segurança, transparência e confiança em cada etapa.`;
  const ehCelular=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const linkWhats=ehCelular?"https://wa.me/"+fone+"?text="+encodeURIComponent(mensagem):"https://web.whatsapp.com/send?phone="+fone+"&text="+encodeURIComponent(mensagem);
window.open(linkWhats,"_blank");
};

    pix.onclick=()=>{
      const telefone=String(r.telefone||"").replace(/\D/g,"");
      const fone=telefone.startsWith("55")?telefone:"55"+telefone;
      const numeros=r.numeros.join(", ");
      const total=r.numeros.length*100;
      const mensagemPix=`Olá, ${r.nome}!

Conforme sua confirmação, seguem os dados para pagamento da sua reserva no Tá Premiado.

Número(s) reservado(s): ${numeros}
Valor total: R$ ${total.toFixed(2).replace(".",",")}

Chave PIX:
36cbf041-f273-420c-bb4f-c57cc6b4cd02

Titular: Felipe Fraile Labarce
Banco: Nubank

Após realizar o pagamento, envie o comprovante nesta conversa para conferência.

Importante: não realize o pagamento caso seus números tenham sido cancelados ou liberados. Em caso de dúvida, confirme conosco antes de efetuar o PIX.

Após a conferência do pagamento, seus números serão confirmados e enviaremos o comprovante de participação.

Tá Premiado
Segurança, transparência e confiança em cada etapa.`;
      const ehCelular=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const linkPix=ehCelular?"https://wa.me/"+fone+"?text="+encodeURIComponent(mensagemPix):"https://web.whatsapp.com/send?phone="+fone+"&text="+encodeURIComponent(mensagemPix);
      window.open(linkPix,"_blank");
    };
   reservasBox.appendChild(div);
 });

 // Área de números já confirmados - consulta administrativa protegida
 const {data:confirmadosData,error:confirmadosErro}=await db.rpc("admin_listar_confirmados");
 const confirmados=(confirmadosData||[]);

 confirmadosBox.innerHTML="";
 if(confirmadosErro){
   console.error(confirmadosErro);
   confirmadosBox.innerHTML='<div class="vazio">Não foi possível carregar os confirmados: '+esc(confirmadosErro.message || confirmadosErro)+'</div>';
   return;
 }
 if(confirmados.length===0){
   confirmadosBox.innerHTML='<div class="vazio">Nenhum número confirmado.</div>';
 } else {
   confirmados.forEach(r=>{
     const div=document.createElement("div");
     div.className="reserva";
     div.innerHTML=`
       <div><strong style="color:#198754">CONFIRMADO</strong></div>
       <div class="numeros">${esc(r.numero)}</div>
       <div class="dados">
         <strong>Nome:</strong> ${esc(r.nome)}<br>
         <strong>WhatsApp:</strong> ${esc(r.telefone || r.whatsapp || "")}<br>
         <strong>CPF:</strong> ${esc(r.cpf)}<br>
         <strong>Reserva original:</strong> ${esc(dataBR(r.reservado_em))}
       </div>
       <div class="acoes">
         <button class="liberar">LIBERAR NÚMERO</button>
       </div>`;
     div.querySelector("button").onclick=()=>liberarConfirmado(r.numero);
     confirmadosBox.appendChild(div);
   });
 }
}

  carregarGrupo();


async function carregarConfirmadosSeparado(){
  confirmadosBox.innerHTML='<div class="vazio">Carregando confirmados...</div>';
  const {data,error}=await db.rpc("admin_listar_confirmados");
  if(error){
    console.error("Erro confirmados:",error);
    confirmadosBox.innerHTML='<div class="vazio">Erro ao carregar confirmados: '+esc(error.message || String(error))+'</div>';
    return;
  }

  const lista=Array.isArray(data)?data:[];
  confirmadosBox.innerHTML="";

  if(lista.length===0){
    confirmadosBox.innerHTML='<div class="vazio">Nenhum número confirmado.</div>';
    return;
  }

  const gruposConfirmados=new Map();

  lista.forEach(r=>{
    // Reservas novas: agrupa pelo reserva_id.
    // Registros antigos sem reserva_id continuam individuais.
    const chave=r.reserva_id
      ? "reserva:"+r.reserva_id
      : "antigo:"+(r.id ?? r.numero);

    if(!gruposConfirmados.has(chave)){
      gruposConfirmados.set(chave,{...r,numeros:[],registros:[]});
    }

    const g=gruposConfirmados.get(chave);
    g.numeros.push(r.numero);
    g.registros.push(r);
  });

  [...gruposConfirmados.values()]
    .sort((a,b)=>new Date(b.confirmado_em || b.reservado_em)-new Date(a.confirmado_em || a.reservado_em))
    .forEach(r=>{
      r.numeros.sort((a,b)=>String(a).localeCompare(String(b)));

      const quantidade=r.numeros.length;
      const total=quantidade*100;

      const div=document.createElement("div");
      div.className="reserva";
      div.innerHTML=`
        <div><strong style="color:#198754">CONFIRMADO</strong></div>
        <div class="numeros">${r.numeros.map(esc).join(", ")}</div>
        <div class="dados">
          <strong>Quantidade:</strong> ${quantidade} número(s)<br>
          <strong>Valor total:</strong> R$ ${total.toFixed(2).replace(".",",")}<br>
          <strong>Nome:</strong> ${esc(r.nome || "")}<br>
          <strong>WhatsApp:</strong> ${esc(r.telefone || r.whatsapp || "")}<br>
          <strong>CPF:</strong> ${esc(r.cpf || "")}<br>
          <strong>Reservado em:</strong> ${esc(dataBR(r.reservado_em))}
        </div>
        <div class="acoes">
          <button class="comprovante">GERAR COMPROVANTE</button>
          ${r.reserva_id ? `<button class="compartilhar">COMPARTILHAR COMPROVANTE</button>` : ""}
          ${r.reserva_id ? `<button class="liberar">LIBERAR TODOS (${quantidade})</button>` : ""}
        </div>`;

      div.querySelector(".comprovante").onclick=()=>{
        if(r.reserva_id) gerarComprovanteAgrupado(r);
        else gerarComprovante(r);
      };

      const btnCompartilhar=div.querySelector(".compartilhar");
      if(btnCompartilhar){
        btnCompartilhar.onclick=()=>compartilharComprovanteDireto(r);
      }

      const btnLiberarTodos=div.querySelector(".liberar");
      if(btnLiberarTodos){
        btnLiberarTodos.onclick=()=>liberarReservaConfirmada(r.reserva_id,quantidade);
      }

      confirmadosBox.appendChild(div);
    });
}
async function compartilharComprovanteDireto(r){
  const nome=r.nome || "";
  const whatsapp=r.telefone || r.whatsapp || "";
  const cpf=r.cpf || "";
  const numeros=Array.isArray(r.numeros)?r.numeros:[r.numero];
  const quantidade=numeros.length;
  const total="R$ "+(quantidade*100).toFixed(2).replace(".",",");
  const dataConfirmacao=r.confirmado_em
    ? new Date(r.confirmado_em).toLocaleString("pt-BR")
    : "Não informada";
  const codigo=r.codigo_reserva || "";
  const linkVerificacao="https://tapremiado.github.io/verificar.html?codigo="+encodeURIComponent(codigo);
  const ehCelular=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  if(!ehCelular){
    const telefone=String(whatsapp).replace(/\D/g,"");
    const fone=telefone.startsWith("55")?telefone:"55"+telefone;
    const mensagem=
      "Olá, "+nome+"!\n\n"+
      "Segue seu comprovante de participação no Tá Premiado.\n\n"+
      "Número(s): "+numeros.join(", ")+"\n"+
      "Código: "+codigo+"\n\n"+
      "Verifique a autenticidade:\n"+linkVerificacao;
    window.open("https://web.whatsapp.com/send?phone="+fone+"&text="+encodeURIComponent(mensagem),"_blank");
    return;
  }

  try{
    if(!window.jspdf || !window.jspdf.jsPDF){
      alert("Aguarde alguns segundos e tente novamente.");
      return;
    }

    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:"mm",format:"a4"});
    let y=20;

    pdf.setFont("helvetica","bold");
    pdf.setFontSize(22);
    pdf.text("TA PREMIADO",105,y,{align:"center"});
    y+=9;
    pdf.setFontSize(13);
    pdf.text("COMPROVANTE DE PARTICIPACAO",105,y,{align:"center"});
    y+=13;
    pdf.setFontSize(12);
    pdf.text("PAGAMENTO CONFIRMADO",105,y,{align:"center"});
    y+=14;

    pdf.setFont("helvetica","normal");
    const linhas=[
      "Participante: "+nome,
      "CPF: "+cpf,
      "WhatsApp: "+whatsapp,
      "Grupo: 001",
      "Premio: Renault Kwid",
      "Valor de referencia do premio: R$ 50.000,00",
      "Numero(s): "+numeros.join(", "),
      "Quantidade: "+quantidade+" numero(s)",
      "Valor total: "+total,
      "Confirmado em: "+dataConfirmacao,
      "Codigo de autenticidade: "+codigo
    ];

    linhas.forEach(l=>{
      const partes=pdf.splitTextToSize(l,175);
      pdf.text(partes,18,y);
      y+=7*partes.length;
    });

    y+=5;
    pdf.setFontSize(10);
    pdf.text("Verifique a autenticidade:",18,y);
    y+=6;
    pdf.text(pdf.splitTextToSize(linkVerificacao,175),18,y);

    const blob=pdf.output("blob");
    const arquivo=new File(
      [blob],
      "Comprovante-Ta-Premiado-"+numeros.join("-")+".pdf",
      {type:"application/pdf"}
    );

    if(navigator.share && navigator.canShare && navigator.canShare({files:[arquivo]})){
      await navigator.share({
        title:"Comprovante Tá Premiado",
        text:"Segue seu comprovante de participação no Tá Premiado.",
        files:[arquivo]
      });
    }else{
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;
      a.download=arquivo.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),2000);
      alert("Este navegador não permite compartilhar PDF diretamente. O PDF foi salvo no aparelho.");
    }
  }catch(e){
    if(e && e.name==="AbortError") return;
    console.error("Erro ao compartilhar:",e);
    alert("Não foi possível compartilhar o comprovante neste aparelho.");
  }
}

async function liberarReservaConfirmada(reservaId,qtd){
  if(!confirm(`Liberar TODOS os ${qtd} número(s) desta compra confirmada? Eles voltarão a ficar disponíveis e os dados desta confirmação serão apagados.`)) return;

  msg.textContent="Liberando compra confirmada...";

  const {data,error}=await db.rpc("admin_liberar_reserva_confirmada",{
    p_reserva_id:reservaId
  });

  if(error){
    console.error(error);
    msg.textContent="Erro ao liberar a compra confirmada.";
    return;
  }

  msg.textContent=`${data} número(s) liberado(s) com sucesso.`;
  await carregar();
  await carregarConfirmadosSeparado();
}

async function liberarConfirmado(numero){
 if(!confirm(`Liberar o número confirmado ${numero}? Ele voltará a ficar disponível e os dados desta confirmação serão apagados.`)) return;
 msg.textContent="Liberando número confirmado...";
 const {data,error}=await db.rpc("admin_liberar_confirmado",{p_numero:numero});
 if(error){
   console.error(error);
   msg.textContent="Erro ao liberar o número confirmado.";
   return;
 }
 if(data===true){
   msg.textContent=`Número ${numero} liberado com sucesso.`;
 } else {
   msg.textContent=`O número ${numero} não estava mais confirmado.`;
 }
 await carregar();
 await carregarConfirmadosSeparado();
}

async function alterar(numero,acao,qtd){
 const texto=acao==="confirmar"
   ? `Confirmar ${qtd} número(s) desta reserva?`
   : `Liberar ${qtd} número(s) desta reserva?`;
 if(!confirm(texto))return;

 msg.textContent=acao==="confirmar"?"Confirmando...":"Liberando...";
 const {data,error}=await db.rpc("admin_alterar_reserva",{
   p_numero_referencia:numero,
   p_acao:acao
 });
 if(error){msg.textContent="Erro ao realizar a operação.";return}
 msg.textContent=`Operação concluída em ${data} número(s).`;
 await carregar();
}
function gerarComprovanteAgrupado(r){
  const nome=r.nome || "";
  const whatsapp=r.telefone || r.whatsapp || "";
  const cpf=r.cpf || "";
  const numeros=Array.isArray(r.numeros)?r.numeros:[r.numero];
  const quantidade=numeros.length;
  const total="R$ "+(quantidade*100).toFixed(2).replace(".",",");
  const dataConfirmacao=r.confirmado_em
    ? new Date(r.confirmado_em).toLocaleString("pt-BR")
    : "Não informada";
  const codigo=r.codigo_reserva || "";
  const linkVerificacao="https://tapremiado.github.io/verificar.html?codigo="+encodeURIComponent(codigo);

  if(!codigo){
    alert("Código de autenticidade da compra não disponível. Atualize o painel e tente novamente.");
    return;
  }

  const w=window.open("", "_blank", "width=800,height=900");

  w.document.write(`
  <!DOCTYPE html>
  <html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Comprovante Tá Premiado</title>
    <style>
      body{font-family:Arial,sans-serif;background:#f4f4f4;padding:30px;color:#222}
      .comprovante{max-width:650px;margin:auto;background:#fff;border:2px solid #111;border-radius:16px;padding:28px}
      h1{text-align:center;margin:0;font-size:32px}
      h2{text-align:center;margin:8px 0 25px;font-size:18px}
      .status{background:#198754;color:white;text-align:center;font-weight:bold;padding:12px;border-radius:8px;margin-bottom:24px}

  async function carregarGrupo(){
  const {data,error}=await db.rpc("admin_consultar_grupo_atual");

  if(error){
    console.error("Erro ao carregar grupo:",error);
    document.getElementById("grupoPremio").textContent="Erro ao carregar";
    document.getElementById("grupoStatus").textContent="Erro ao carregar";
    return;
  }

  const g=Array.isArray(data) ? data[0] : data;

  if(!g){
    document.getElementById("grupoPremio").textContent="Grupo não encontrado";
    document.getElementById("grupoStatus").textContent="Grupo não encontrado";
    return;
  }

  document.getElementById("grupoCodigo").textContent=g.codigo || "---";
  document.getElementById("grupoPremio").textContent=g.premio || "-";

  if(g.status==="finalizado"){
    document.getElementById("grupoStatus").textContent="FINALIZADO";

    document.getElementById("grupoEmAndamento").style.display="none";
    document.getElementById("grupoFinalizado").style.display="block";

    document.getElementById("grupoNumeroContemplado").textContent=
      g.numero_contemplado || "-";

    document.getElementById("grupoDataApuracao").textContent=
      g.data_apuracao
        ? new Date(g.data_apuracao).toLocaleString("pt-BR")
        : "-";
  }else{
    document.getElementById("grupoStatus").textContent="EM ANDAMENTO";

    document.getElementById("grupoEmAndamento").style.display="block";
    document.getElementById("grupoFinalizado").style.display="none";
  }
}

  document.getElementById("btnFinalizarGrupo").onclick = async function(){
  const numero = document.getElementById("numeroContemplado").value.trim();

  if(!numero){
    alert("Digite o número contemplado.");
    return;
  }

  if(!confirm("Confirma a finalização do Grupo 001 com o número " + numero + "?")){

  const {error}=await db.rpc("admin_finalizar_grupo",{

  });

  alert("Grupo 001 finalizado com sucesso!");
